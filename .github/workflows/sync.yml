name: Tesla Telemetri Senkronizasyonu

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install requests

      - name: Python Betiğini Çalıştır
        env:
          TESLA_REFRESH_TOKEN: ${{ secrets.TESLA_REFRESH_TOKEN }}
        run: python3 run.py


      - name: Değişiklikleri Otomatik Kaydet ve Gönder
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: vehicle_data.json
          commit_message: 'Otomatik Telemetri Güncellemesi'


